[package]
name = "luti-color-picker"
version = "1.7.1"
edition = "2021"
rust-version = "1.92"
authors = ["Lucas Tiago"]
license = "MIT"
repository = "https://github.com/eulucastiagolt/luti-color-picker"
description = "Desktop color picker with a magnifier and visual history"

[[bin]]
name = "luti-color-picker"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.11", package = "gtk4" }
gdk = { version = "0.11", package = "gdk4" }
gdk-pixbuf = "0.22"
gio = "0.22"
glib = "0.22"
cairo-rs = { version = "0.22", features = ["png"] }
async-channel = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libloading = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
semver = "1"
x11rb = { version = "0.13", features = ["image"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ashpd = { version = "0.9", default-features = false, features = ["async-std"] }
ksni = { version = "0.3.7", features = ["blocking"] }
